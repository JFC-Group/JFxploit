[project]
name = "jfxploit"
version = "0.1.0"
description = "CLI toolkit for JCOW414 router exploitation"
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
]

[project.scripts]
jfxploit = "jfxploit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
